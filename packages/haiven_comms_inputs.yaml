# Haiven Communications - Summaries, Notes & Alerts
# How the system communicates with caregivers

input_button:
  refresh_summary:
    name: Refresh Summary
    icon: mdi:refresh

# Off by default. While it is off, no activity data is sent to any AI
# provider: summaries and alerts are plain text built on the hub.
input_boolean:
  haiven_ai_summaries:
    name: AI Summaries
    icon: mdi:creation

input_text:
  # The conversation agent that words the summaries when AI Summaries is on.
  # Empty means conversation.claude_conversation.
  haiven_ai_agent:
    name: AI Agent
    max: 100
    icon: mdi:robot-outline

  # AI-generated dashboard summary (updated by daily summary automations)
  current_summary:
    name: Current Summary
    max: 255
    icon: mdi:message-text
    initial: "Waiting for first summary..."

  # Care notes and documentation
  latest_care_note:
    name: Latest Care Note
    max: 255
    mode: text
    icon: mdi:note-text

  next_appointment_details:
    name: Next Appointment Details
    max: 200
    icon: mdi:calendar-text

  care_note_author:
    name: Note Author
    max: 50
    icon: mdi:account-edit

  alerts_fired_today:
    name: Alerts Fired Today
    max: 255
    icon: mdi:bell-alert
    initial: ""

  daily_note:
    name: Daily Note
    max: 255
    mode: text
    icon: mdi:note-edit

input_datetime:
  # When her phone last arrived home. Walking in the door is activity: without
  # this, a two-hour trip out reads as two hours of silence the moment she gets
  # back and pushes "Needs Attention". Set by the location log automation; no
  # `initial:`, so a restart does not reset the clock.
  arrived_home:
    name: Arrived Home
    has_date: true
    has_time: true
    icon: mdi:home-import-outline
