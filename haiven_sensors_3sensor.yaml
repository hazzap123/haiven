            {% set summary = summary + ['Kitchen: ' + relative_time(kitchen)] %}
          {% endif %}
          {% if bedroom and as_datetime(bedroom).date() == now().date() %}
            {% set summary = summary + ['Bedroom: ' + relative_time(bedroom)] %}
          {% endif %}
