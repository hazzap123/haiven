          {% if avg not in ['unknown', 'unavailable', none] %}
            {% set total = avg | float(0) | round(0) | int %}
            {% if total > 0 %}
              {% set hours = (total // 60) %}
              {% set minutes = (total % 60) %}
              {{ '%02d:%02d' | format(hours, minutes) }}
            {% else %}
              Calculating
            {% endif %}
          {% else %}
            Calculating
          {% endif %}
        attributes:
