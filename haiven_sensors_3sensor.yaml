        unique_id: room_activity_summary
        state: >
          {% set kitchen = states.event.kitchen_motion.last_changed %}
          {% set bedroom = states.binary_sensor.haiven_bedroom_occupancy.last_changed %}
          {% set bathroom = states.binary_sensor.haiven_bathroom_motion.last_changed %}
  
          {% set summary = [] %}
