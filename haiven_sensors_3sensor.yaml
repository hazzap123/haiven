            {% set b = (w[6:8] | int(0)) * 60 + (w[9:11] | int(0)) %}
            {% set m = hours * 60 + minutes %}
            {% set inside = (a <= m < b) if a < b else (m >= a or m < b) %}
            {% if inside %}
              {{ (m + (1440 if m < 720 else 0)) | int(0) }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}
        attributes:
          source: sensor.today_bedtime
          valid_range: "{{ states('sensor.bedtime_window') }}"
        icon: mdi:bed-clock

  - sensor:
