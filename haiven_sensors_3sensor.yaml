  # Sensor Health Check - 3 Sensors
  - sensor:
      - name: "Sensor Health Status"
        unique_id: sensor_health_status
        state: >
          {% set kitchen = 'event.kitchen_motion' %}
          {% set bedroom = 'binary_sensor.haiven_bedroom_occupancy' %}
          {% set bathroom = 'binary_sensor.haiven_bathroom_motion' %}
  
          {% set kitchen_ok = states(kitchen) not in ['unknown', 'unavailable'] %}
          {% set bedroom_ok = states(bedroom) not in ['unknown', 'unavailable'] %}
          {% set bathroom_ok = states(bathroom) not in ['unknown', 'unavailable'] %}
  
          {% set online_count = 0 %}
          {% if kitchen_ok %}{% set online_count = online_count + 1 %}{% endif %}
          {% if bedroom_ok %}{% set online_count = online_count + 1 %}{% endif %}
          {% if bathroom_ok %}{% set online_count = online_count + 1 %}{% endif %}
  
          {% if online_count == 3 %}
            All online
          {% elif online_count == 2 %}
            1 offline: check
          {% elif online_count == 1 %}
            2 offline: check
          {% else %}
            All offline: check
          {% endif %}
        icon: >
          {% set kitchen = 'event.kitchen_motion' %}
          {% set bedroom = 'binary_sensor.haiven_bedroom_occupancy' %}
          {% set bathroom = 'binary_sensor.haiven_bathroom_motion' %}
  
          {% set kitchen_ok = states(kitchen) not in ['unknown', 'unavailable'] %}
          {% set bedroom_ok = states(bedroom) not in ['unknown', 'unavailable'] %}
          {% set bathroom_ok = states(bathroom) not in ['unknown', 'unavailable'] %}
  
          {% set online_count = 0 %}
          {% if kitchen_ok %}{% set online_count = online_count + 1 %}{% endif %}
          {% if bedroom_ok %}{% set online_count = online_count + 1 %}{% endif %}
          {% if bathroom_ok %}{% set online_count = online_count + 1 %}{% endif %}
  
          {% if online_count == 3 %}
            mdi:check-circle
          {% elif online_count >= 2 %}
            mdi:alert
          {% else %}
            mdi:alert-circle
          {% endif %}
        attributes:
          kitchen_status: "{{ states('event.kitchen_motion') }}"
          kitchen_last: "{{ relative_time(states.event.kitchen_motion.last_changed) }} ago"
          bedroom_status: "{{ states('binary_sensor.haiven_bedroom_occupancy') }}"
          bedroom_last: "{{ relative_time(states.binary_sensor.haiven_bedroom_occupancy.last_changed) }} ago"
          bathroom_status: "{{ states('binary_sensor.haiven_bathroom_motion') }}"
          bathroom_last: "{{ relative_time(states.binary_sensor.haiven_bathroom_motion.last_changed) }} ago"
          bathroom_battery: "{{ states('sensor.haiven_bathroom_battery') }}%"

  # Room Activity Summary
  - sensor:
