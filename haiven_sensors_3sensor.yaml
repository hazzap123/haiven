          source: sensor.average_bedtime_minutes_week
          using_fallback: "{{ states('sensor.average_bedtime_minutes_week') in ['unknown', 'unavailable', none] or (states('sensor.average_bedtime_minutes_week') | float(0) | round(0) | int) == 0 }}"
        icon: mdi:bed-clock

